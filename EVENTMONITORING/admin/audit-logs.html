<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../auth/assets/ElTresEresCenciaEscuelaLogo.png" />
    <title>Audit Logs — Smart Academic Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../shared/global.css" />
    <link rel="stylesheet" href="../Gemma/gemma.css" />
    <link rel="stylesheet" href="admin-specific.css" />
    <style>
        .audit-summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .audit-summary .stat-card {
            min-height: 116px;
        }

        .audit-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .audit-filters {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .audit-filters select,
        .audit-filters input {
            border: 1px solid #d9e3ee;
            border-radius: 0.6rem;
            padding: 0.6rem 0.8rem;
            background: #f9fbfe;
            color: var(--text-main);
            min-height: 42px;
        }

        .audit-toggle {
            display: inline-flex;
            gap: 0.35rem;
            background: #edf5fb;
            border: 1px solid #d9e5f1;
            border-radius: 0.7rem;
            padding: 0.25rem;
            margin-bottom: 0.85rem;
        }

        .audit-toggle button {
            border: none;
            background: transparent;
            color: #45637e;
            padding: 0.5rem 0.85rem;
            border-radius: 0.55rem;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .audit-toggle button.active {
            background: #176aa4;
            color: white;
            box-shadow: 0 4px 12px rgba(23, 106, 164, 0.18);
        }

        .audit-table-wrap {
            overflow: auto;
            border-radius: 0.8rem;
            border: 1px solid #dfeaf5;
            background: white;
        }

        table.audit-table {
            width: 100%;
            min-width: 1200px;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        .audit-table thead th {
            background: #eef6fb;
            color: #214d6b;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.9rem 0.8rem;
            border-bottom: 1px solid #dfeaf5;
            text-align: left;
        }

        .audit-table tbody td {
            padding: 0.8rem;
            border-bottom: 1px solid #edf3f9;
            vertical-align: top;
            color: #1d3557;
        }

        .audit-table tbody tr:hover {
            background: #f7fbff;
        }

        .badge-audit {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 0.35rem 0.7rem;
            font-size: 0.72rem;
            font-weight: 700;
            background: #eaf3ff;
            color: #1a5fa8;
        }

        .badge-audit.success { background: #e8f8ee; color: #1f7d52; }
        .badge-audit.warning { background: #fff4df; color: #b37100; }
        .badge-audit.danger { background: #ffe7e7; color: #bf3d3d; }
        .badge-audit.info { background: #edf3ff; color: #3c59d4; }

        .log-details {
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Source Sans 3', sans-serif;
            background: #f5f9fd;
            border-radius: 0.5rem;
            padding: 0.5rem 0.65rem;
            margin: 0;
            color: #32516b;
        }

        .audit-session-summary {
            color: #345a7d;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .audit-session-details {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding: 0.7rem 0.2rem 0.2rem;
        }

        .audit-session-item {
            border-left: 3px solid #176aa4;
            background: #f7fbff;
            border-radius: 0.6rem;
            padding: 0.75rem 0.9rem;
        }

        .audit-session-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.35rem;
        }

        .audit-session-meta {
            color: #4d6b80;
            font-size: 0.74rem;
            margin-bottom: 0.4rem;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem 1rem;
        }

        @media (max-width: 900px) {
            .audit-summary {
                grid-template-columns: repeat(2, minmax(160px, 1fr));
            }
        }

        @media (max-width: 600px) {
            .audit-summary {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <div id="sidebar-container"></div>

    <main class="main-content">
        <div class="page-header anim anim-1" style="display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; width:100%;">
            <div>
                <h1>Audit Logs</h1>
                <p>Track who accessed the system, which module they opened, and what actions they performed.</p>
            </div>
        </div>

        <div class="audit-summary anim anim-2">
            <div class="stat-card blue">
                <div class="stat-label">Total Events</div>
                <div class="stat-value" id="totalAuditEvents">0</div>
            </div>
            <div class="stat-card green">
                <div class="stat-label">Logins</div>
                <div class="stat-value" id="loginCount">0</div>
            </div>
            <div class="stat-card orange">
                <div class="stat-label">Page Access</div>
                <div class="stat-value" id="pageAccessCount">0</div>
            </div>
            <div class="stat-card purple">
                <div class="stat-label">Module Selections</div>
                <div class="stat-value" id="moduleSelectionCount">0</div>
            </div>
        </div>

        <div class="panel anim anim-3">
            <div class="audit-toolbar">
                <div class="toolbar-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <path d="M14 2v6h6"/>
                        <path d="M16 13H8"/>
                        <path d="M16 17H8"/>
                        <path d="M10 9h.01"/>
                    </svg>
                    Activity History
                </div>

                <div class="audit-filters">
                    <div class="audit-toggle" aria-label="Audit view toggle">
                        <button type="button" class="active" data-view-mode="grouped">Session View</button>
                        <button type="button" data-view-mode="raw">Raw Events</button>
                    </div>
                    <input type="text" id="auditSearch" placeholder="Search user, role, action, or module..." />
                    <select id="auditActionFilter">
                        <option value="all">All Actions</option>
                        <option value="LOGIN">Login</option>
                        <option value="LOGOUT">Logout</option>
                        <option value="PAGE_ACCESS">Page Access</option>
                        <option value="MODULE_SELECT">Module Select</option>
                        <option value="ADD">Add</option>
                        <option value="UPDATE">Update</option>
                        <option value="DELETE">Delete</option>
                    </select>
                    <select id="auditModuleFilter">
                        <option value="all">All Modules</option>
                    </select>
                </div>
            </div>

            <div class="audit-table-wrap">
                <table class="audit-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>User</th>
                            <th>Role</th>
                            <th>Action</th>
                            <th>Module</th>
                            <th>Page</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                    <tbody id="auditLogsTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <button class="help-btn">?</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config/.env.js"></script>
    <script src="../config/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../shared/global.js"></script>
    <script src="admin-specific.js"></script>
    <script>
        requireSuperAdmin();
        loadHeader();
        loadSidebar('audit-logs');

        const auditState = {
            logs: [],
            filterAction: 'all',
            filterModule: 'all',
            searchText: '',
            viewMode: 'grouped',
            expandedGroupId: null
        };

        function formatDateTime(value) {
            if (!value) return '—';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return value;
            return date.toLocaleString([], {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function getActionBadgeClass(action) {
            const normalized = String(action || '').toUpperCase();
            if (['LOGIN', 'PAGE_ACCESS', 'MODULE_SELECT'].includes(normalized)) return 'info';
            if (['ADD', 'UPDATE'].includes(normalized)) return 'success';
            if (['DELETE', 'LOGOUT'].includes(normalized)) return 'warning';
            return 'info';
        }

        function humanizePageName(pageName) {
            if (!pageName) return 'a system page';
            return String(pageName)
                .replace(/\.(html|php|js)$/i, '')
                .replace(/[_-]+/g, ' ')
                .replace(/\b\w/g, char => char.toUpperCase());
        }

        function humanizeModuleName(moduleName) {
            if (!moduleName) return 'the system';
            return String(moduleName)
                .replace(/[_-]+/g, ' ')
                .replace(/\b\w/g, char => char.toUpperCase());
        }

        function formatFriendlyAuditText(log) {
            if (!log) return 'No additional details';

            const action = String(log.action || 'ACTION').toUpperCase();
            const pageName = humanizePageName(log.page_name);
            const moduleName = humanizeModuleName(log.module_name);
            const details = log.details || {};

            if (action === 'LOGIN') return `Signed in to ${moduleName}.`;
            if (action === 'LOGOUT') return `Signed out of ${moduleName}.`;
            if (action === 'PAGE_ACCESS') {
                if (details && details.access_type === 'page_view') return `Viewed the ${pageName.toLowerCase()} page.`;
                if (details && details.url) return `Opened the ${pageName.toLowerCase()} page.`;
                return `Accessed the ${pageName.toLowerCase()} page.`;
            }
            if (action === 'MODULE_SELECT') {
                const label = details && (details.label || details.module_label || details.module || details.module_name || log.module_name || 'selected module');
                const friendlyLabel = String(label).replace(/[_-]+/g, ' ').replace(/\b\w/g, char => char.toUpperCase());
                return `Selected: ${friendlyLabel}.`;
            }
            if (action === 'ADD') return `Added a new item in ${pageName}.`;
            if (action === 'UPDATE') return `Updated information in ${pageName}.`;
            if (action === 'DELETE') return `Deleted an item from ${pageName}.`;
            if (details && typeof details === 'object') {
                const firstValue = Object.values(details).find(value => value !== null && value !== undefined && value !== '');
                if (firstValue) return `Completed an activity in ${pageName}.`;
            }
            return `Performed ${action.toLowerCase().replace('_', ' ')} in ${pageName}.`;
        }

        function summarizeDetails(log) {
            if (!log) return 'No additional details';
            return formatFriendlyAuditText(log);
        }

        function buildSessionGroups(logs) {
            const ordered = [...logs].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            const groups = [];
            let currentGroup = null;

            ordered.forEach((log) => {
                const userKey = String(log.user_id || log.email || log.full_name || 'unknown-user');
                const action = String(log.action || '').toUpperCase();

                if (action === 'LOGIN') {
                    currentGroup = {
                        id: `session-${log.id || `${userKey}-${log.created_at}`}`,
                        userKey,
                        userLabel: log.full_name || log.email || 'Unknown User',
                        email: log.email || 'No email',
                        role: log.role || 'Unknown',
                        firstTime: log.created_at,
                        lastTime: log.created_at,
                        actions: [log],
                        modules: new Set([log.module_name || 'system'])
                    };
                    groups.push(currentGroup);
                    return;
                }

                if (!currentGroup || currentGroup.userKey !== userKey) {
                    currentGroup = {
                        id: `session-${log.id || `${userKey}-${log.created_at}`}`,
                        userKey,
                        userLabel: log.full_name || log.email || 'Unknown User',
                        email: log.email || 'No email',
                        role: log.role || 'Unknown',
                        firstTime: log.created_at,
                        lastTime: log.created_at,
                        actions: [log],
                        modules: new Set([log.module_name || 'system'])
                    };
                    groups.push(currentGroup);
                    return;
                }

                currentGroup.actions.push(log);
                currentGroup.lastTime = log.created_at;
                if (log.module_name) currentGroup.modules.add(log.module_name);

                if (action === 'LOGOUT') {
                    currentGroup = null;
                }
            });

            return groups.map((group) => ({
                ...group,
                modules: [...group.modules].filter(Boolean),
                totalActions: group.actions.length,
                firstAction: group.actions[0],
                lastAction: group.actions[group.actions.length - 1]
            }));
        }

        function getFilteredEntries() {
            const sourceLogs = [...auditState.logs];
            let filtered = sourceLogs;

            if (auditState.filterAction !== 'all') {
                filtered = filtered.filter(log => String(log.action || '').toUpperCase() === auditState.filterAction);
            }

            if (auditState.filterModule !== 'all') {
                filtered = filtered.filter(log => String(log.module_name || '').toLowerCase() === auditState.filterModule.toLowerCase());
            }

            if (auditState.searchText) {
                const term = auditState.searchText.toLowerCase();
                filtered = filtered.filter(log => {
                    const text = [
                        log.full_name,
                        log.email,
                        log.role,
                        log.action,
                        log.module_name,
                        log.page_name,
                        log.details ? JSON.stringify(log.details) : ''
                    ].join(' ').toLowerCase();
                    return text.includes(term);
                });
            }

            if (auditState.viewMode === 'grouped') {
                return buildSessionGroups(filtered);
            }

            return filtered.map((log) => ({
                id: `log-${log.id || `${log.user_id || 'user'}-${log.created_at}`}`,
                userKey: String(log.user_id || log.email || log.full_name || 'unknown-user'),
                userLabel: log.full_name || log.email || 'Unknown User',
                email: log.email || 'No email',
                role: log.role || 'Unknown',
                firstTime: log.created_at,
                lastTime: log.created_at,
                actions: [log],
                modules: [log.module_name || 'system'],
                totalActions: 1,
                firstAction: log,
                lastAction: log
            }));
        }

        function renderAuditLogs() {
            const tbody = document.getElementById('auditLogsTableBody');
            if (!tbody) return;

            const entries = getFilteredEntries();
            const totalEvents = auditState.logs.length;
            const loginCount = auditState.logs.filter(log => String(log.action || '').toUpperCase() === 'LOGIN').length;
            const pageAccessCount = auditState.logs.filter(log => String(log.action || '').toUpperCase() === 'PAGE_ACCESS').length;
            const moduleSelectionCount = auditState.logs.filter(log => String(log.action || '').toUpperCase() === 'MODULE_SELECT').length;

            document.getElementById('totalAuditEvents').textContent = totalEvents;
            document.getElementById('loginCount').textContent = loginCount;
            document.getElementById('pageAccessCount').textContent = pageAccessCount;
            document.getElementById('moduleSelectionCount').textContent = moduleSelectionCount;

            if (!entries.length) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-state">No audit events match the current filters.</td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = entries.map((entry) => {
                const isExpanded = auditState.expandedGroupId === entry.id;
                const actionSummary = entry.totalActions > 1
                    ? `${entry.firstAction.action || 'ACTION'} + ${entry.totalActions - 1} more`
                    : (entry.firstAction.action || 'ACTION');

                const summaryText = entry.modules.length > 1
                    ? `${entry.modules.slice(0, 2).join(', ')}${entry.modules.length > 2 ? '...' : ''}`
                    : (entry.modules[0] || 'system');

                const detailsHtml = entry.actions.map((log) => `
                    <div class="audit-session-item">
                        <div class="audit-session-header">
                            <span class="badge-audit ${getActionBadgeClass(log.action)}">${(log.action || 'ACTION').toUpperCase()}</span>
                            <small>${formatDateTime(log.created_at)}</small>
                        </div>
                        <div class="audit-session-meta">${humanizeModuleName(log.module_name)} • ${humanizePageName(log.page_name)}</div>
                        <pre class="log-details">${summarizeDetails(log)}</pre>
                    </div>
                `).join('');

                return `
                    <tr class="audit-group-row" data-group-id="${entry.id}" style="cursor:pointer;">
                        <td>${formatDateTime(entry.firstTime)}</td>
                        <td>
                            <strong>${entry.userLabel}</strong><br>
                            <small>${entry.email}</small>
                        </td>
                        <td>${entry.role || 'Unknown'}</td>
                        <td><span class="badge-audit ${getActionBadgeClass(entry.firstAction.action)}">${actionSummary.toUpperCase()}</span></td>
                        <td>${summaryText}</td>
                        <td>${humanizePageName(entry.firstAction.page_name || 'unknown')}</td>
                        <td>
                            <div class="audit-session-summary">${entry.totalActions} action${entry.totalActions > 1 ? 's' : ''} in this session</div>
                        </td>
                    </tr>
                    ${isExpanded ? `
                        <tr class="audit-detail-row">
                            <td colspan="7">
                                <div class="audit-session-details">
                                    ${detailsHtml}
                                </div>
                            </td>
                        </tr>
                    ` : ''}
                `;
            }).join('');
        }

        async function loadAuditLogs() {
            try {
                if (!supabaseClient) {
                    console.error('Supabase client not initialized');
                    return;
                }

                const { data, error } = await supabaseClient
                    .from('system_audit_logs')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(500);

                if (error) throw error;

                auditState.logs = data || [];

                const moduleSelect = document.getElementById('auditModuleFilter');
                if (moduleSelect) {
                    const uniqueModules = [...new Set(auditState.logs
                        .map(log => (log.module_name || '').trim())
                        .filter(Boolean))].sort();

                    const current = moduleSelect.value;
                    moduleSelect.innerHTML = '<option value="all">All Modules</option>' + uniqueModules.map(module => 
                        `<option value="${module}">${module}</option>`
                    ).join('');

                    if (uniqueModules.includes(current)) {
                        moduleSelect.value = current;
                    } else {
                        moduleSelect.value = 'all';
                    }
                }

                renderAuditLogs();
            } catch (error) {
                console.error('Failed to load audit logs:', error);
                document.getElementById('auditLogsTableBody').innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-state">Unable to load audit logs right now.</td>
                    </tr>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            const filterAction = document.getElementById('auditActionFilter');
            const filterModule = document.getElementById('auditModuleFilter');
            const searchInput = document.getElementById('auditSearch');

            if (filterAction) {
                filterAction.addEventListener('change', function () {
                    auditState.filterAction = filterAction.value;
                    renderAuditLogs();
                });
            }

            if (filterModule) {
                filterModule.addEventListener('change', function () {
                    auditState.filterModule = filterModule.value;
                    renderAuditLogs();
                });
            }

            if (searchInput) {
                searchInput.addEventListener('input', function () {
                    auditState.searchText = searchInput.value.trim();
                    renderAuditLogs();
                });
            }

            document.querySelectorAll('[data-view-mode]').forEach((button) => {
                button.addEventListener('click', function () {
                    const mode = button.dataset.viewMode;
                    auditState.viewMode = mode;
                    auditState.expandedGroupId = null;
                    document.querySelectorAll('[data-view-mode]').forEach((btn) => {
                        btn.classList.toggle('active', btn === button);
                    });
                    renderAuditLogs();
                });
            });

            document.getElementById('auditLogsTableBody').addEventListener('click', function (event) {
                const row = event.target.closest('.audit-group-row');
                if (!row) return;
                const groupId = row.dataset.groupId;
                auditState.expandedGroupId = auditState.expandedGroupId === groupId ? null : groupId;
                renderAuditLogs();
            });

            loadAuditLogs();
        });
    </script>
</body>
</html>
